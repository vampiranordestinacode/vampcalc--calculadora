<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🦇 VampCalc</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="calculadora">

    <!-- TOPO -->
    <div class="topo">

        <img src="imagens/Mascote.png" alt="Mascote" class="vampi">

        <div class="visor">

            <input type="text" id="display" value="0" readonly>

        </div>

    </div>

    <!-- BOTÕES -->
    <div class="botoes">

        <button class="clear">C</button>

        <button class="funcao">☠️</button>

        <button class="funcao">±</button>

        <button class="operador">÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operador">×</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operador">−</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operador mais">+</button>

        <button>0</button>

        <button>.</button>

        <button class="igual">=</button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
